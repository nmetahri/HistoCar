# ============================================================
# DÉVELOPPEMENT — Docker Compose (HistoCar)
# ============================================================
# Lance toute la stack en hot-reload :
#   • db      → Postgres (publié sur :5432)
#   • server  → ts-node-dev (:3001) + debugger (:9229)
#   • web     → vite dev server (:5173)
#
# Le code est monté depuis l'hôte ; node_modules vit dans des
# volumes nommés (binaires natifs Prisma/esbuild côté Linux).
#
# Usage : make dev
# ============================================================

services:
  db:
    container_name: histocar-db-dev
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    networks:
      - histocar-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    container_name: histocar-server-dev
    build:
      context: .
      dockerfile: packages/server/Dockerfile.dev
    ports:
      - "3001:3001"
      - "9229:9229"
    volumes:
      - .:/app
      - server_root_modules:/app/node_modules
      - server_pkg_modules:/app/packages/server/node_modules
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: development
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - histocar-dev-network

  web:
    container_name: histocar-web-dev
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_root_modules:/app/node_modules
      - web_pkg_modules:/app/packages/web/node_modules
    environment:
      VITE_API_URL: http://localhost:3001/api
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - histocar-dev-network

volumes:
  db_data_dev:
  server_root_modules:
  server_pkg_modules:
  web_root_modules:
  web_pkg_modules:

networks:
  histocar-dev-network:
    name: histocar-dev-network
    driver: bridge
