services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: histocar
      POSTGRES_PASSWORD: histocar
      POSTGRES_DB: histocar
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U histocar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
