# ============================================================
# PRODUCTION — Docker Compose (HistoCar)
# ============================================================
# Usage : make up-prod
# Services : db + migrate (one-shot) + server + web + tunnel
#
# Tout est same-origin : nginx (web) sert le bundle et proxifie
# /api/ vers server:3001. Le tunnel cloudflare n'expose que web.
# ============================================================

include:
  - path: cloudflared-tunnel/tunnel.compose.yml
    # Résout les chemins relatifs (volumes, env_file) par rapport à ce
    # projet, pas au sous-module.
    project_directory: .

services:
  db:
    container_name: histocar-db
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    # Pas de port publié : la base n'est joignable que depuis le réseau
    # docker interne. `make db-prod` passe par `docker compose exec`.
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - histocar-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    container_name: histocar-migrate
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      target: builder
    # Le bootstrap rattache les véhicules antérieurs au compte AUTH_USERNAME.
    command: >
      sh -c "npx prisma migrate deploy --schema packages/server/prisma/schema.prisma
      && node packages/server/dist/scripts/bootstrap-owner.js"
    env_file:
      - path: .env
        format: raw
    depends_on:
      db:
        condition: service_healthy
    networks:
      - histocar-network
    security_opt:
      - no-new-privileges:true
    restart: "no"

  server:
    container_name: histocar-server
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - histocar-network
    security_opt:
      - no-new-privileges:true

  web:
    container_name: histocar-web
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - histocar-network
    security_opt:
      - no-new-privileges:true

  # Défini en amont dans cloudflared-tunnel/tunnel.compose.yml — étendu ici
  # pour se rattacher au réseau HistoCar et attendre que web soit prêt.
  cloudflared-tunnel:
    container_name: cloudflared-tunnel-histocar
    # Override de la commande upstream : passe l'UUID en argument positionnel
    # pour que cloudflared résolve le tunnel depuis le CLI. Le `tunnel:
    # ${TUNNEL_UUID}` de config.yaml n'est pas interpolé par cloudflared
    # lui-même, donc l'argument positionnel est ce qui fait foi.
    command: >-
      --config /etc/cloudflared/config.yaml
      --cred-file /etc/cloudflared/${TUNNEL_UUID}.json
      tunnel run ${TUNNEL_UUID}
    depends_on:
      - web
    networks:
      - histocar-network
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:

networks:
  histocar-network:
    name: histocar-network
    driver: bridge
